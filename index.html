<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <title>Original Salon</title>

    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <main>
      <section class="hero">
        <div class="container hero__layout">
          <div class="hero__content">
            <p class="hero__eyebrow">
              HAIR &amp; RELAXATION
            </p>

            <h1 class="hero__title">
              髪も心も、軽くなる時間を。
            </h1>

            <p class="hero__lead">
              一人ひとりの髪と気持ちに向き合い、
              ゆっくり過ごせる時間を提供します。
            </p>

            <a class="hero__cta" href="#features">
              私たちの特徴を見る
            </a>
          </div>

          <div class="hero__media">
            <img
              src="./assets/hero-placeholder.svg"
              width="1200"
              height="900"
              alt=""
            >
          </div>
        </div>
      </section>

      <section
        id="features"
        class="features"
        aria-labelledby="features-title"
      >
        <div class="container">
          <header class="features__header">
            <p class="features__eyebrow">
              OUR FEATURES
            </p>

            <h2
              id="features-title"
              class="features__title"
            >
              私たちの特徴
            </h2>
          </header>

          <div class="features__grid">
            <article class="feature-card">
              <img
                class="feature-card__image"
                src="./assets/feature-01-placeholder.svg"
                width="800"
                height="600"
                alt=""
              >

              <div class="feature-card__body">
                <h3 class="feature-card__title">
                  経験豊富なスタイリスト
                </h3>

                <p class="feature-card__text">
                  髪質や生活スタイルに合わせて、
                  無理なく続けられるスタイルをご提案します。
                </p>
              </div>
            </article>

            <article class="feature-card">
              <img
                class="feature-card__image"
                src="./assets/feature-02-placeholder.svg"
                width="800"
                height="600"
                alt=""
              >

              <div class="feature-card__body">
                <h3 class="feature-card__title">
                  ゆったり過ごせる空間
                </h3>

                <p class="feature-card__text">
                  自然光が入る落ち着いた店内で、
                  周囲を気にせずゆっくりお過ごしいただけます。
                </p>
              </div>
            </article>

            <article class="feature-card">
              <img
                class="feature-card__image"
                src="./assets/feature-03-placeholder.svg"
                width="800"
                height="600"
                alt=""
              >

              <div class="feature-card__body">
                <h3 class="feature-card__title">
                  一人ひとりに合うメニュー
                </h3>

                <p class="feature-card__text">
                  カットやカラーだけでなく、
                  髪や頭皮の状態に合わせたケアをご案内します。
                </p>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
